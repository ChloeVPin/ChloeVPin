name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ChloeVPin
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          filename: github-metrics.svg
          config_output: svg
          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_aliases: yes
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 15
          # Community and stars
          plugin_followup: yes
          plugin_stars: yes
          plugin_stars_limit: 4
          # Activity and contributions
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_lines: yes
          # Year calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Commit the generated SVG
        run: |
          git config user.name "chloevpin"
          git config user.email "chloevpin@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "no metrics change"
          else
            git commit -m "metrics: update profile SVG"
            git push
          fi
